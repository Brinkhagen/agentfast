<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-label="AgentFast v0.2.0 premium launch graphic: Risk-aware test recommendations, local-first, no API key.">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080F22"/><stop offset=".54" stop-color="#101C38"/><stop offset="1" stop-color="#070A17"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#10D8F6" stop-opacity=".23"/><stop offset="1" stop-color="#10D8F6" stop-opacity="0"/></radialGradient>
<linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#34E4F5"/><stop offset=".58" stop-color="#3BB8FD"/><stop offset="1" stop-color="#7A6BFA"/></linearGradient>
<linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#132543"/><stop offset="1" stop-color="#0B152A"/></linearGradient>
<filter id="shadow"><feGaussianBlur stdDeviation="30"/></filter>
<pattern id="dot" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#5B8BAB" opacity=".17"/></pattern>
</defs>
<rect width="1080" height="1350" fill="url(#bg)"/>
<circle cx="860" cy="300" r="500" fill="url(#glow)"/>
<path d="M540 0 L1080 300 M700 0 L1080 170 M1000 0 L1080 35" stroke="#43ACF2" stroke-width="2" opacity=".12"/>
<rect width="1080" height="1350" fill="url(#dot)"/>
<rect x="34" y="34" width="1012" height="1282" rx="35" fill="none" stroke="#5F88BB" stroke-opacity=".26" stroke-width="2"/>
<!-- Brand header -->
<rect x="76" y="78" width="61" height="61" rx="16" fill="url(#cyan)"/>
<path d="M95 96 H115 L121 102 L115 109 L121 116 L115 123 H95 Z" fill="none" stroke="#08142A" stroke-width="6" stroke-linejoin="round"/>
<text x="156" y="118" fill="#F6FAFF" font-family="Arial,Helvetica,sans-serif" font-size="30" letter-spacing="7" font-weight="700">BRINKHAGEN</text>
<rect x="768" y="86" width="235" height="44" rx="22" fill="#122A44" stroke="#3F8CA8"/>
<circle cx="793" cy="108" r="6" fill="#45E4F0"/>
<text x="811" y="116" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#C9E5F8" letter-spacing="1.7">OPEN SOURCE</text>
<!-- Eyebrow -->
<text x="80" y="217" fill="#53DAEF" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" letter-spacing="6">INTRODUCING  /  v0.2.0</text>
<!-- Hero -->
<text x="74" y="337" fill="#FCFDFF" font-family="Arial,Helvetica,sans-serif" font-size="112" font-weight="800" letter-spacing="-5">Agent</text>
<text x="378" y="337" fill="url(#cyan)" font-family="Arial,Helvetica,sans-serif" font-size="112" font-weight="800" letter-spacing="-5">Fast</text>
<rect x="79" y="367" width="92" height="7" rx="3" fill="url(#cyan)"/>
<text x="80" y="440" fill="#F4FAFF" font-family="Arial,Helvetica,sans-serif" font-size="51" font-weight="700" letter-spacing="-1.3">AI writes code.</text>
<text x="80" y="501" fill="#61D8FC" font-family="Arial,Helvetica,sans-serif" font-size="51" font-weight="700" letter-spacing="-1.3">You decide what to test.</text>
<text x="80" y="558" fill="#9EB8D6" font-family="Arial,Helvetica,sans-serif" font-size="25">Explainable, risk-aware test recommendations</text>
<text x="80" y="595" fill="#9EB8D6" font-family="Arial,Helvetica,sans-serif" font-size="25">for JavaScript &amp; TypeScript Git changes.</text>
<!-- Decision panel -->
<rect x="78" y="644" width="924" height="412" rx="28" fill="#070C1B" fill-opacity=".6" stroke="#345478" stroke-width="2"/>
<rect x="78" y="644" width="924" height="58" rx="28" fill="#162740"/>
<rect x="78" y="675" width="924" height="27" fill="#162740"/>
<circle cx="113" cy="674" r="8" fill="#F67882"/><circle cx="140" cy="674" r="8" fill="#F6C76A"/><circle cx="167" cy="674" r="8" fill="#51D6B1"/>
<text x="205" y="681" fill="#AAC3DC" font-size="19" font-family="Consolas,Menlo,monospace">agentfast  /  decision paths</text>
<!-- Targeted -->
<rect x="109" y="731" width="865" height="132" rx="19" fill="url(#panel)" stroke="#2E6C73" stroke-width="2"/>
<rect x="132" y="757" width="142" height="42" rx="10" fill="#0D423E"/>
<text x="151" y="785" fill="#69EBC5" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="800">TARGETED</text>
<text x="298" y="784" fill="#F2FBFF" font-size="26" font-family="Arial,Helvetica,sans-serif" font-weight="700">Simple + understood change</text>
<text x="134" y="829" fill="#A6C4D8" font-size="21" font-family="Arial,Helvetica,sans-serif">Suggest related tests for fast local feedback</text>
<!-- Full suite -->
<rect x="109" y="888" width="865" height="132" rx="19" fill="url(#panel)" stroke="#666098" stroke-width="2"/>
<rect x="132" y="914" width="163" height="42" rx="10" fill="#312B5D"/>
<text x="151" y="942" fill="#C4A8FC" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="800">FULL SUITE</text>
<text x="317" y="941" fill="#F2FBFF" font-size="26" font-family="Arial,Helvetica,sans-serif" font-weight="700">Sensitive or uncertain change</text>
<text x="134" y="987" fill="#A6C4D8" font-size="21" font-family="Arial,Helvetica,sans-serif">Recommend all tests when confidence is low</text>
<!-- Badges -->
<rect x="78" y="1087" width="282" height="57" rx="28" fill="#122B3D" stroke="#316C88"/>
<text x="115" y="1124" fill="#C0E8FA" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="700">Git-aware</text>
<rect x="377" y="1087" width="281" height="57" rx="28" fill="#122B3D" stroke="#316C88"/>
<text x="415" y="1124" fill="#C0E8FA" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="700">No API key</text>
<rect x="674" y="1087" width="328" height="57" rx="28" fill="#122B3D" stroke="#316C88"/>
<text x="713" y="1124" fill="#C0E8FA" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="700">MIT licensed</text>
<!-- Footer CTA -->
<rect x="77" y="1174" width="928" height="88" rx="20" fill="url(#cyan)"/>
<text x="114" y="1228" fill="#071326" font-size="28" font-family="Arial,Helvetica,sans-serif" font-weight="800" letter-spacing="1">TRY THE 10-MINUTE BETA</text>
<text x="565" y="1228" fill="#09273D" font-size="20" font-family="Arial,Helvetica,sans-serif" font-weight="700">github.com/Brinkhagen/agentfast</text>
<text x="80" y="1295" fill="#839DBA" font-size="18" font-family="Arial,Helvetica,sans-serif">Advisory only — required CI still runs before merge or release.</text>
</svg>