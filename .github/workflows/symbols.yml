name: Optional TypeScript symbol preview

on:
  pull_request:
    paths:
      - 'src/symbols.js'
      - 'src/cli.js'
      - 'tests/symbols.test.js'
      - 'package.json'
      - '.github/workflows/symbols.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: TypeScript AST preview (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install optional parser for this CI job only
        run: npm install --no-save --package-lock=false --ignore-scripts typescript@5.8.3
      - name: Verify real AST paths and existing safety behavior
        run: npm run verify
      - name: Pack the CLI without adding a runtime TypeScript dependency
        run: npm pack --dry-run
