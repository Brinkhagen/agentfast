name: GitHub Release

# Only publish versions which have passed the complete cross-platform CI matrix.
# This workflow runs solely for successful pushes to main from this repository.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: agentfast-release
  cancel-in-progress: false

jobs:
  release:
    name: Release verified version
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Verify
        run: npm run verify
      - name: Publish only if this version does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          LOCK_VERSION="$(node -p "require('./package-lock.json').version")"
          if [[ "$VERSION" != "$LOCK_VERSION" ]]; then
            echo "Package and lockfile versions disagree; release blocked." >&2
            exit 1
          fi
          CURRENT_MAIN="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$RELEASE_COMMIT" != "$CURRENT_MAIN" ]]; then
            echo "A newer main commit exists. Releasing only the latest verified main commit."
            exit 0
          fi
          TAG="v$VERSION"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Refusing invalid semantic version: $VERSION" >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG already published: preserving the existing immutable release."
            exit 0
          fi
          FILE="$(npm pack --silent | tail -n 1)"
          test -f "$FILE"
          NOTES=".github/RELEASE_NOTES_$TAG.md"
          if [[ -f "$NOTES" ]]; then
            gh release create "$TAG" "$FILE" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" --title "AgentFast $TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" "$FILE" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" --title "AgentFast $TAG" --generate-notes
          fi
